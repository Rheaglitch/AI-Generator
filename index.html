<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBIG.ai - Portal Alat AI Generatif</title>
    <link rel="icon" href="./assets/logo-UBIG.png" type="image/x-icon">
    <!-- Memuat Tailwind CSS untuk styling modern dan responsif -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Menggunakan font Inter */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            transition: background-color 0.3s;
        }
        
        /* Style kustom untuk efek hover pada card */
        .ai-card {
            /* Transisi lebih halus untuk semua properti transform */
            transition: transform 0.4s ease-out, box-shadow 0.4s;
            cursor: pointer;
            perspective: 1000px; /* Jarak pandang untuk efek 3D */
            /* Mempersiapkan browser untuk perubahan transform agar rendering lebih cepat */
            will-change: transform, box-shadow; 
            /* Penting: Setel posisi relatif untuk kartu (tetap perlu untuk overflow:hidden) */
            position: relative; 
            overflow: hidden; /* Pastikan konten tidak keluar dari batas card */
        }
        
        /* GAYA CARD-GLARE DIBUANG KARENA PERMINTAAN USER */
        
        /* Class custom untuk box ikon yang super bulat */
        .rounded-icon-box {
            border-radius: 2rem; /* Sekitar 32px */
            z-index: 20; /* Pastikan ikon tetap di atas */
            position: relative;
        }
        /* Gaya kursor untuk tag yang dapat diklik */
        .clickable-tag {
            cursor: pointer;
        }
    </style>
</head>
<!-- Body diatur ke Dark Mode permanen -->
<body class="bg-gray-900 text-gray-100 p-4 sm:p-8 transition-colors duration-300">

    <!-- Kontainer Utama -->
    <div class="w-full max-w-7xl mx-auto">

        <!-- Header dan Branding (Mode Gelap) -->
        <header id="main-header" class="text-center py-10 mb-8 bg-gray-800 rounded-xl shadow-2xl border border-red-700 relative transition-colors duration-300">
            
            <!-- Konten Header (Teks) -->
            <div class="px-4">
                <!-- Gradasi teks dari merah muda ke merah gelap -->
                <h1 class="text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-red-700 md:text-6xl">
                    UBIG.<span class="text-gray-100">AI</span> Portal
                </h1>
                <!-- TAGLINE BARU DENGAN PENYEBUTAN GRATIS -->
                <p id="tagline-text" class="mt-3 text-xl font-medium text-gray-300 transition-colors duration-300">Temukan dan Gunakan Alat AI Generatif Terbaik, Sepenuhnya <span class="text-red-600 font-bold">Gratis</span>!</p>
            </div>
        </header>

        <!-- Bagian Pencarian dan Filter (Mode Gelap) -->
        <div id="search-bar-container" class="mb-10 p-5 bg-gray-800 rounded-xl shadow-2xl border border-red-700 transition-colors duration-300">
            
            <!-- Struktur FLEX HORIZONTAL untuk SEMUA ukuran (hanya Input dan Filter) -->
            <div class="flex items-center space-x-3 flex-nowrap"> 
                
                <!-- 1. Input Pencarian (Mengambil sisa ruang) -->
                <div class="relative flex-grow">
                    <!-- Input fields diatur ke bg-gray-700, teks putih, placeholder abu-abu -->
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="Ketik kata kunci ( contoh : video, foto, generator )..."
                        class="w-full py-3 pl-12 pr-4 bg-gray-700 text-gray-100 placeholder-gray-400 border border-red-500 rounded-full focus:ring-2 focus:ring-red-600 focus:border-red-600 outline-none transition duration-200 shadow-inner"
                        onkeydown="handleInputKeyDown(event)" 
                    />
                    <!-- Ikon Pencarian -->
                    <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                
                <!-- 2. Filter Dropdown (Menggunakan w-max agar lebar sesuai konten terpanjang) -->
                <div class="relative flex-shrink-0 w-max">
                    <select 
                        id="type-filter"
                        onchange="filterTools()"
                        class="py-3 px-4 pr-10 bg-gray-700 text-gray-100 border border-red-500 rounded-full focus:ring-2 focus:ring-red-600 focus:border-red-600 appearance-none outline-none transition duration-200 shadow-inner"
                    >
                        <option value="all">Semua Tipe</option>
                        <option value="visual">Foto</option>
                        <option value="text">Teks</option>
                        <option value="code">Video</option>
                        <option value="audio">Audio</option>
                    </select>
                    <!-- Custom Arrow Icon for Select -->
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-red-500">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"></path></svg>
                    </div>
                </div>
                
            </div>
        </div>

        <!-- Kontainer Card Alat AI -->
        <div id="ai-tool-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Card akan di-inject di sini oleh JavaScript -->
        </div>

        <!-- Pesan Tidak Ditemukan (Mode Gelap) -->
        <div id="not-found-message" class="hidden text-center mt-10 p-8 bg-gray-800 rounded-lg border-2 border-dashed border-red-600 transition-colors duration-300">
            <!-- Teks abu-abu terang di mode gelap -->
            <p class="text-xl text-gray-400">😢 Alat AI yang Anda cari tidak ditemukan. Coba kata kunci lain!</p>
        </div>

        <!-- Footer (Mode Gelap) -->
        <footer id="main-footer" class="mt-20 py-4 text-center text-sm text-gray-400 border-t border-gray-700 transition-colors duration-300">
            &copy; 2024 UBIG.ai Portal. Dibuat dengan semangat Generatif.
        </footer>

    </div>

    <script>
        // Data Alat AI, sekarang berisi dua generator
        const aiTools = [
            { 
                name: "Action Figur AI Generator", 
                // DESKRIPSI BARU: Wujudkan Hero Impianmu!
                desc: "Wujudkan Hero Impianmu! Ubah teks atau fotomu menjadi figur aksi 3D super keren, siap dicetak dan dikoleksi.", 
                url: "https://g.co/gemini/share/4fd026bf0f3a", // <-- LINK BARU DARI PERMINTAAN TERAKHIR
                // TAG 'visual' DIGANTI MENJADI 'foto'
                tags: ["action figure", "3D", "foto", "model", "generatif"],
                icon: "🦸", // Ikon Pahlawan Super
                type: "visual" // Tipe internal: visual
            },
            // Kartu Gemini Image & Video Generator
            {
                name: "Gemini Image & Video Generator",
                // DESKRIPSI BARU: Sihir Visual Tanpa Batas.
                desc: "Sihir Visual Tanpa Batas. Ciptakan masterpiece gambar dan video sinematik hanya dari imajinasi dan perintah kata-kata.",
                url: "https://g.co/gemini/share/9070b960d162", 
                // Tipe visual dan kode (karena video sering diklasifikasikan sebagai kode/media)
                tags: ["gambar", "video", "media", "visual", "generatif"],
                icon: "🎥", // Ikon Film
                type: "code" // Tipe internal: kode (dipilih untuk mewakili video)
            }
        ];

        const container = document.getElementById('ai-tool-container');
        const notFoundMessage = document.getElementById('not-found-message');
        const inputField = document.getElementById('search-input');
        const selectField = document.getElementById('type-filter');


        /**
         * Fungsi baru: Memasukkan tag ke input pencarian dan menjalankan filter.
         */
        function searchByTag(tag) {
            inputField.value = tag;
            filterTools();
        }

        /**
         * Menghitung posisi kursor relatif terhadap kartu dan menerapkan transformasi 3D dinamis.
         * Dipanggil saat mouse bergerak di atas kartu.
         */
        function handleCardTilt(e, card) {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left; // Posisi X kursor relatif terhadap elemen
            const y = e.clientY - rect.top;  // Posisi Y kursor relatif terhadap elemen
            const middleX = rect.width / 2;
            const middleY = rect.height / 2;
            
            // --- Peningkatan Efek 3D ---
            const maxRotate = 12; // Sudut putar maksimum
            const liftAmount = 15; // Jarak angkat maksimum
            // ----------------------------

            // Hitung sudut kemiringan
            // Sudut kemiringan berlawanan arah dari kursor (efek menonjol)
            const rotateX = ((middleY - y) / middleY) * maxRotate; 
            const rotateY = ((x - middleX) / middleX) * -maxRotate; 

            // Terapkan transformasi dinamis (angkat dan putar)
            card.style.transform = `translateY(-${liftAmount}px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            
            // Terapkan bayangan yang lebih kuat pada hover
            card.style.boxShadow = '0 25px 50px -10px rgba(220, 38, 38, 0.8)'; 

            // --- Efek Glare/Pencahayaan Dinamis (Spotlight Bundar) ---
            // TIDAK ADA LAGI ELEMEN GLARE
            const glare = card.querySelector('.card-glare');
            if (glare) {
                glare.style.opacity = '0'; // Pastikan opacity 0 jika elemennya ada
            }
        }

        /**
         * Mengatur ulang transformasi kartu saat kursor meninggalkan kartu.
         */
        function resetCardTilt(card) {
            // Mengatur ulang transformasi menjadi nol (transisi CSS akan membuatnya halus)
            card.style.transform = 'none';
            // Mengatur ulang bayangan
            card.style.boxShadow = 'none';

            // Mengatur ulang glare (dihapus, tapi ini untuk jaga-jaga)
            const glare = card.querySelector('.card-glare');
            if (glare) {
                glare.style.opacity = '0';
                glare.style.transform = 'translate(0, 0)';
            }
        }


        /**
         * Mengkonversi array tools menjadi HTML card dan menampilkannya.
         */
        function renderCards(toolsToRender) {
            container.innerHTML = ''; 
            
            // Kelas Dark Mode Permanen
            const cardBg = 'bg-gray-800';
            const cardShadow = 'shadow-2xl shadow-red-900/40';
            const titleColor = 'text-gray-100';
            const descColor = 'text-gray-400';
            const tagBg = 'bg-red-700';
            const tagText = 'text-white';
            const dividerColor = 'border-gray-700';
            
            // Atur warna Not Found Message
            notFoundMessage.classList.remove('hidden');
            notFoundMessage.className = 'text-center mt-10 p-8 bg-gray-800 rounded-lg border-2 border-dashed border-red-600 transition-colors duration-300';
            notFoundMessage.querySelector('p').className = 'text-xl text-gray-400';
            
            if (toolsToRender.length === 0) {
                notFoundMessage.classList.remove('hidden');
                return;
            }
            notFoundMessage.classList.add('hidden');

            toolsToRender.forEach(tool => {
                // Membuat Tag HTML untuk tags/keywords. Ditambahkan onclick untuk searchByTag
                const tagHtml = tool.tags.map(tag => 
                    `<span onclick="event.preventDefault(); searchByTag('${tag}')" class="clickable-tag inline-block ${tagBg} ${tagText} text-xs font-semibold px-3 py-1 rounded-full mr-1 mb-1 transition duration-200 hover:bg-red-500 hover:text-white">${tag}</span>`
                ).join('');

                const cardHtml = `
                    <!-- Link Wrapper: Seluruh kartu bisa diklik -->
                    <a href="${tool.url}" target="_blank" 
                        class="ai-card block w-full rounded-3xl overflow-hidden ${cardBg} ${cardShadow} border border-gray-700 hover:border-red-400"
                        onmousemove="handleCardTilt(event, this)"
                        onmouseleave="resetCardTilt(this)"
                    >
                        <!-- Elemen Glare/Pencahayaan Absolut SUDAH DIHAPUS -->
                        
                        
                        <!-- 1. Area Header dengan Gradasi (Meniru warna latar atas gambar) -->
                        <div class="relative p-6 pt-12 bg-gradient-to-r from-red-800 to-red-900">
                            <!-- VISUAL ONLY -->
                        </div>

                        <!-- 2. Area Ikon (Kotak Putih/Terang yang Menonjol) -->
                        <!-- Posisi ikon di luar alur normal dan geser ke atas -->
                        <div class="relative -mt-10 mx-auto w-4/5 md:w-3/5">
                            <div class="p-4 rounded-icon-box bg-gray-700 shadow-2xl shadow-red-900/50 border border-gray-600/50">
                                <span class="block text-center text-7xl">${tool.icon}</span>
                            </div>
                        </div>

                        <!-- 3. Area Konten Utama (Bawah) -->
                        <div class="p-6 pt-4 text-center">
                            
                            <!-- Judul dan Deskripsi (Judul di bawah ikon) -->
                            <h3 class="text-2xl font-bold ${titleColor} mt-4">${tool.name}</h3>
                            <p class="mt-2 text-sm ${descColor} mb-6">${tool.desc}</p>
                            
                            <!-- Tags Area (Pindah ke atas Tombol) -->
                            <div class="flex flex-wrap justify-center pt-2 border-t ${dividerColor} mt-4 mb-6">
                                ${tagHtml}
                            </div>
                            
                            <!-- Tombol Aksi (Paling Bawah) -->
                            <div class="pt-2"> <!-- Tambahkan padding atas untuk jarak dari tags/divider -->
                                <span class="inline-flex items-center justify-center w-full max-w-xs px-4 py-3 text-lg font-bold rounded-xl bg-red-600 text-white shadow-xl hover:bg-red-700 transition duration-300 transform hover:scale-[1.01]">
                                    Buka Generator AI
                                    <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                                </span>
                            </div>
                        </div>
                    </a>
                `;
                container.innerHTML += cardHtml;
            });
        }

        /**
         * Mengambil input pencarian dan memfilter alat AI.
         */
        function filterTools() {
            const query = inputField.value.toLowerCase().trim();
            const filterType = selectField.value; 
            
            if (query === "" && filterType === "all") {
                renderCards(aiTools); 
                return;
            }

            const filteredTools = aiTools.filter(tool => {
                const nameMatch = tool.name.toLowerCase().includes(query); 
                const descMatch = tool.desc.toLowerCase().includes(query);
                const tagsMatch = tool.tags.some(tag => tag.toLowerCase().includes(query)); 
                const textMatches = nameMatch || descMatch || tagsMatch;

                const typeMatches = (filterType === 'all') || (tool.type === filterType);
                
                return textMatches && typeMatches;
            });

            // Lakukan pengurutan untuk memastikan kartu baru tampil pertama
            // Filter hanya akan mempengaruhi urutan jika ada query/filter aktif.
            // Untuk memastikan kartu baru (index 1) terlihat, kita tidak perlu mengurutkan jika tidak ada filter.

            renderCards(filteredTools);
        }

        /**
         * Menangani event keydown pada input pencarian.
         */
        function handleInputKeyDown(event) {
            if (event.key === 'Enter') {
                event.preventDefault(); 
                filterTools();
            }
        }
        
        // Tampilkan semua card saat halaman dimuat
        window.onload = () => {
            filterTools();
        };
    </script>
</body>
</html>
